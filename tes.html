<!DOCTYPE html>
<html lang="id" x-data="app()" :class="{'dark': dark}" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools Online — Ahmat Badali</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { display: ['PT Sans', 'sans-serif'], body: ['DM Sans', 'sans-serif'] },
          colors: {
            accent: 'rgb(var(--accent-rgb) / <alpha-value>)',
            'accent-light': 'rgb(var(--accent-light-rgb) / <alpha-value>)'
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --accent-rgb: 59 111 245;
      --accent-light-rgb: 125 168 255;
    }
    html, body { font-family: 'DM Sans', sans-serif; }
    h1, h2, h3 { font-family: 'PT Sans', sans-serif; }
    [x-cloak] { display: none !important; }
  </style>
</head>

<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased min-h-screen flex flex-col">

  <!-- Header / Navbar -->
  <header class="border-b border-zinc-100 dark:border-zinc-900 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md sticky top-0 z-50">
    <nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="font-display font-bold text-xl tracking-tight">
        <span class="text-zinc-900 dark:text-white">ahmat</span><span class="text-accent">badali</span>
      </a>

      <div class="flex items-center gap-4">
        <a href="index.html" class="text-sm font-medium text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition-colors">
          ← Kembali ke Utama
        </a>
        <button @click="dark=!dark" class="w-9 h-9 flex items-center justify-center rounded-full border border-zinc-200 dark:border-zinc-800">
          <span x-show="!dark">☾</span>
          <span x-show="dark" x-cloak>☀</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow max-w-6xl mx-auto px-6 py-12 w-full">
    <div class="mb-10">
      <p class="text-xs font-medium text-accent tracking-widest uppercase mb-2">Web Utilities</p>
      <h1 class="font-display font-bold text-4xl md:text-5xl text-zinc-900 dark:text-white">Tools Online</h1>
      <p class="text-zinc-500 dark:text-zinc-400 mt-2">Kumpulan alat bantu dan kalkulator online sederhana.</p>
    </div>

    <!-- Grid Tempat Tools Kamu -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <!-- Contoh Tool 1 -->
      <div class="p-6 rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/50">
        <div class="w-10 h-10 rounded-xl bg-accent/10 text-accent flex items-center justify-center mb-4 text-xl">
          <i class="fa-solid fa-calculator"></i>
        </div>
        <h3 class="font-bold text-lg text-zinc-900 dark:text-white mb-2">Kalkulator Volume Beton</h3>
        <p class="text-xs text-zinc-500 dark:text-zinc-400 mb-4">Hitung estimasi kebutuhan kubikasi beton untuk pekerjaan struktur.</p>
        <button class="w-full py-2 bg-accent text-white rounded-xl text-sm font-medium hover:bg-accent-light transition-colors">Buka Tool</button>
      </div>

      <!-- Tempat Penambahan Tool Berikutnya -->
      <div class="p-6 rounded-2xl border border-dashed border-zinc-300 dark:border-zinc-800 flex flex-col items-center justify-center text-center">
        <i class="fa-solid fa-plus text-2xl text-zinc-400 mb-2"></i>
        <p class="text-sm font-medium text-zinc-500">Tool Baru Segera Hadir</p>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-100 dark:border-zinc-900 py-6">
    <div class="max-w-6xl mx-auto px-6 text-center text-xs text-zinc-500">
      © <span id="yr"></span> Ahmat Badali. Tools Hub.
    </div>
  </footer>

  <script>
    function app() {
      return {
        dark: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches),
        init() {
          this.$watch('dark', v => localStorage.setItem('theme', v ? 'dark' : 'light'));
          document.getElementById('yr').textContent = new Date().getFullYear();
        }
      }
    }
  </script>
</body>
</html>
