<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CodeSnap — generator code screenshot bergaya Carbon, responsif desktop dan mobile.">
<title>CodeSnap — Code Screenshot Generator</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/atom-one-dark.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/typescript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/scss.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/less.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/php.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/kotlin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/swift.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/cpp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/csharp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/ruby.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/perl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/lua.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/r.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/matlab.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/dart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/scala.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/groovy.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/powershell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/ini.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/http.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/graphql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/diff.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

:root{
    --bg:#0d1117;
    --panel:#111827;
    --panel2:#172033;
    --line:#263247;
    --text:#f5f7fb;
    --muted:#9aa6b8;
    --accent:#7c5cff;
    --radius:14px;
}

body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--line);
    background:#0b1018;
    position:sticky;
    top:0;
    z-index:50;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:17px;
}

.brand-mark{
    width:30px;
    height:30px;
    border-radius:9px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    font-size:15px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.btn{
    border:1px solid var(--line);
    background:#141c2a;
    color:var(--text);
    border-radius:9px;
    padding:8px 12px;
    font-size:13px;
    font-weight:650;
}

.btn:hover{
    background:#1c2739;
}

.btn.primary{
    background:var(--accent);
    border-color:var(--accent);
}

.btn.primary:hover{
    filter:brightness(1.08);
}

/* LAYOUT */

.layout{
    display:flex;
    flex:1;
    min-height:calc(100vh - 64px);
}

/* SIDEBAR */

.sidebar{
    width:285px;
    flex:0 0 285px;
    border-right:1px solid var(--line);
    background:#0f1622;
    padding:18px;
    overflow:auto;
}

.section{
    padding:0 0 20px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
}

.section:last-child{
    border-bottom:0;
}

.section h3{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:#7f8ba0;
    margin:0 0 11px;
}

.field{
    margin-bottom:12px;
}

.label{
    font-size:12px;
    color:#aab5c6;
    margin-bottom:6px;
    display:block;
}

select,
input[type=text],
input[type=number]{
    width:100%;
    border:1px solid var(--line);
    background:#121b29;
    color:var(--text);
    border-radius:8px;
    padding:9px 10px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#6574ff;
    box-shadow:0 0 0 2px #6574ff22;
}

.row{
    display:flex;
    gap:8px;
}

.row>*{
    flex:1;
}

.range-row{
    display:flex;
    align-items:center;
    gap:10px;
}

input[type=range]{
    width:100%;
    accent-color:var(--accent);
}

.value{
    font-size:12px;
    color:var(--muted);
    min-width:38px;
    text-align:right;
}

/* BACKGROUNDS */

.swatches{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.swatch{
    height:36px;
    border-radius:9px;
    border:2px solid transparent;
    position:relative;
    overflow:hidden;
}

.swatch.active{
    border-color:white;
}

.bg-purple{
    background:
        radial-gradient(circle at 20% 20%,#9b5cff,transparent 38%),
        linear-gradient(135deg,#312e81,#7c3aed);
}

.bg-sunset{
    background:linear-gradient(135deg,#fb7185,#f97316,#facc15);
}

.bg-ocean{
    background:linear-gradient(135deg,#075985,#0e7490,#06b6d4);
}

.bg-aurora{
    background:
        radial-gradient(circle at 20% 30%,#22c55e,transparent 35%),
        radial-gradient(circle at 80% 70%,#06b6d4,transparent 38%),
        #172554;
}

.bg-pink{
    background:linear-gradient(135deg,#831843,#be185d,#7e22ce);
}

.bg-dark{
    background:#171b24;
}

.bg-light{
    background:#e8edf4;
}

.bg-transparent{
    background:transparent;
}

/* SWITCH */

.toggle-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
    font-size:13px;
}

.switch{
    position:relative;
    width:40px;
    height:22px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#273246;
    border-radius:20px;
    transition:.2s;
}

.slider:before{
    content:"";
    position:absolute;
    width:16px;
    height:16px;
    left:3px;
    top:3px;
    background:white;
    border-radius:50%;
    transition:.2s;
}

.switch input:checked + .slider{
    background:var(--accent);
}

.switch input:checked + .slider:before{
    transform:translateX(18px);
}

/* WORKSPACE */

.workspace{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#0b1018;
}

.mobile-bar{
    display:none;
}

/* TOOLBAR */

.toolbar{
    height:52px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:#0e1520;
}

.toolbar-left{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}

.file-icon{
    width:25px;
    height:25px;
    border-radius:6px;
    background:#182235;
    display:grid;
    place-items:center;
    color:#aab6c8;
    font-size:12px;
}

.filename{
    font-size:13px;
    color:#dce2ec;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.lang-badge{
    font-size:11px;
    color:#91a0b7;
    background:#151e2d;
    border:1px solid var(--line);
    padding:4px 7px;
    border-radius:6px;
}

/* EDITOR */

.editor-wrap{
    padding:16px;
    background:#090e15;
}

.editor{
    position:relative;
    display:flex;
    min-height:330px;
    max-height:56vh;
    overflow:auto;
    background:#0d1117;
    border:1px solid #202b3d;
    border-radius:10px;
}

.lines{
    flex:0 0 48px;
    padding:16px 10px 16px 0;
    text-align:right;
    color:#566176;
    font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    user-select:none;
    background:#0b1017;
    border-right:1px solid #1b2636;
}

.code-layer{
    position:relative;
    flex:1;
    min-width:0;
}

#highlight{
    margin:0;
    padding:16px;
    min-height:100%;
    font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    color:#e6edf3;
}

#code{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    padding:16px;
    border:0;
    outline:0;
    resize:none;
    background:transparent;
    color:transparent;
    caret-color:#fff;
    font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre-wrap;
    overflow:auto;
    overflow-wrap:anywhere;
    z-index:2;
}

#code::selection{
    background:#5c6cff55;
}

/* PREVIEW */

.preview-area{
    flex:1;
    min-height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    overflow:auto;
    background:#080c12;
}

.export-frame{
    padding:64px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-width:min(100%,900px);
}

.code-card{
    width:min(820px,90vw);
    overflow:hidden;
    border-radius:var(--radius);
    box-shadow:0 24px 70px #0008;
    background:#0d1117;
    border:1px solid #ffffff16;
}

.window-bar{
    height:44px;
    display:flex;
    align-items:center;
    padding:0 15px;
    background:#111827;
}

.dots{
    display:flex;
    gap:7px;
}

.dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#697386;
}

.window-title{
    flex:1;
    text-align:center;
    font:12px ui-monospace,monospace;
    color:#8c98aa;
    margin:0 30px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.preview-code{
    display:flex;
}

.preview-lines{
    padding:18px 12px 18px 18px;
    text-align:right;
    color:#58667d;
    font:14px/1.6 ui-monospace,monospace;
    background:#0b1017;
    user-select:none;
}

.preview-highlight{
    flex:1;
    margin:0;
    padding:18px;
    min-width:0;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font:14px/1.6 ui-monospace,monospace;
}

/* DRAWER */

.drawer{
    position:fixed;
    inset:0;
    background:#0009;
    z-index:80;
    display:none;
}

.drawer.open{
    display:block;
}

.drawer-panel{
    position:absolute;
    right:0;
    top:0;
    bottom:0;
    width:min(360px,92vw);
    overflow:auto;
    background:#101824;
    border-left:1px solid var(--line);
    padding:18px;
}

.drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.drawer-head h2{
    font-size:17px;
    margin:0;
}

/* TOAST */

.toast{
    position:fixed;
    right:18px;
    bottom:18px;
    background:#151d2b;
    border:1px solid var(--line);
    padding:10px 14px;
    border-radius:9px;
    font-size:13px;
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:.2s;
    z-index:100;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

.hidden{
    display:none !important;
}

/* MOBILE */

@media(max-width:820px){

    .header{
        height:58px;
        padding:0 12px;
    }

    .layout{
        min-height:calc(100vh - 58px);
    }

    .sidebar{
        display:none;
    }

    .mobile-bar{
        display:flex;
        height:50px;
        align-items:center;
        gap:8px;
        padding:7px 10px;
        border-bottom:1px solid var(--line);
        overflow:auto;
        background:#0e1520;
    }

    .mobile-bar button,
    .mobile-bar select{
        flex:0 0 auto;
    }

    .mobile-bar select{
        width:135px;
        padding:7px 8px;
    }

    .toolbar{
        height:48px;
        padding:0 10px;
    }

    .editor-wrap{
        padding:10px;
    }

    .editor{
        min-height:300px;
        max-height:46vh;
    }

    .preview-area{
        padding:14px;
        min-height:320px;
    }

    .export-frame{
        padding:30px 16px;
        min-width:100%;
    }

    .code-card{
        width:100%;
        max-width:none;
    }

    .preview-highlight,
    .preview-lines{
        font-size:12px;
        line-height:1.55;
    }

    .preview-highlight{
        padding:14px;
    }

    .preview-lines{
        padding:14px 9px 14px 12px;
    }
}

@media(max-width:480px){

    .brand{
        font-size:15px;
    }

    .brand-mark{
        width:27px;
        height:27px;
    }

    .header-actions .secondary,
    .header-actions .reset{
        display:none;
    }

    .editor{
        min-height:260px;
    }

    #code,
    #highlight,
    .lines{
        font-size:12px;
        line-height:1.5;
    }

    #code,
    #highlight{
        padding:13px;
    }

    .lines{
        padding:13px 8px 13px 0;
        flex-basis:38px;
    }

    .window-bar{
        height:38px;
    }

    .dot{
        width:9px;
        height:9px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="brand">
        <div class="brand-mark">&lt;/&gt;</div>
        <span>CodeSnap</span>
    </div>

    <div class="header-actions">
        <button class="btn secondary" id="copyBtn">
            Copy
        </button>

        <button class="btn reset" id="resetBtn">
            Reset
        </button>

        <button class="btn primary" id="pngBtn">
            Export PNG
        </button>
    </div>

</header>


<div class="layout">

<!-- SIDEBAR DESKTOP -->

<aside class="sidebar">

    <div class="section">

        <h3>Code</h3>

        <div class="field">
            <label class="label">Language</label>

            <select id="language"></select>
        </div>

        <div class="field">

            <label class="label">
                Filename
            </label>

            <input
                id="filename"
                type="text"
                value="snippet.js"
                maxlength="120"
            >

        </div>

        <div class="row">

            <div class="field">

                <label class="label">
                    Font
                </label>

                <select id="font">

                    <option value="mono">
                        JetBrains Mono
                    </option>

                    <option value="system">
                        System Mono
                    </option>

                    <option value="consolas">
                        Consolas
                    </option>

                </select>

            </div>


            <div class="field">

                <label class="label">
                    Size
                </label>

                <input
                    id="fontSize"
                    type="number"
                    min="10"
                    max="28"
                    value="14"
                >

            </div>

        </div>

    </div>


    <div class="section">

        <h3>Theme</h3>

        <select id="theme">

            <option value="atom-one-dark">
                Atom One Dark
            </option>

            <option value="github-dark">
                GitHub Dark
            </option>

            <option value="monokai">
                Monokai
            </option>

            <option value="night-owl">
                Night Owl
            </option>

            <option value="tokyo-night-dark">
                Tokyo Night Dark
            </option>

            <option value="stackoverflow-dark">
                Stack Overflow Dark
            </option>

        </select>

    </div>


    <div class="section">

        <h3>Background</h3>

        <div class="swatches">

            <button
                class="swatch bg-purple active"
                data-bg="purple"
                title="Purple">
            </button>

            <button
                class="swatch bg-sunset"
                data-bg="sunset"
                title="Sunset">
            </button>

            <button
                class="swatch bg-ocean"
                data-bg="ocean"
                title="Ocean">
            </button>

            <button
                class="swatch bg-aurora"
                data-bg="aurora"
                title="Aurora">
            </button>

            <button
                class="swatch bg-pink"
                data-bg="pink"
                title="Pink">
            </button>

            <button
                class="swatch bg-dark"
                data-bg="dark"
                title="Dark">
            </button>

            <button
                class="swatch bg-light"
                data-bg="light"
                title="Light">
            </button>

            <button
                class="swatch bg-transparent"
                data-bg="transparent"
                title="Transparent">
            </button>

        </div>

    </div>


    <div class="section">

        <h3>Window</h3>

        <div class="toggle-row">

            <span>Window controls</span>

            <label class="switch">

                <input
                    id="showWindow"
                    type="checkbox"
                    checked
                >

                <span class="slider"></span>

            </label>

        </div>


        <div class="toggle-row">

            <span>Title</span>

            <label class="switch">

                <input
                    id="showTitle"
                    type="checkbox"
                    checked
                >

                <span class="slider"></span>

            </label>

        </div>


        <div class="toggle-row">

            <span>Line numbers</span>

            <label class="switch">

                <input
                    id="showLines"
                    type="checkbox"
                    checked
                >

                <span class="slider"></span>

            </label>

        </div>

    </div>


    <div class="section">

        <h3>Spacing</h3>

        <div class="field">

            <label class="label">
                Padding
            </label>

            <div class="range-row">

                <input
                    id="padding"
                    type="range"
                    min="10"
                    max="110"
                    value="64"
                >

                <span
                    class="value"
                    id="paddingVal">
                    64px
                </span>

            </div>

        </div>


        <div class="field">

            <label class="label">
                Radius
            </label>

            <div class="range-row">

                <input
                    id="radius"
                    type="range"
                    min="0"
                    max="30"
                    value="14"
                >

                <span
                    class="value"
                    id="radiusVal">
                    14px
                </span>

            </div>

        </div>

    </div>

</aside>


<!-- WORKSPACE -->

<main class="workspace">


    <!-- MOBILE BAR -->

    <div class="mobile-bar">

        <button
            class="btn"
            id="settingsBtn">

<div
    class="toast"
    id="toast">
</div>


<script>

const defaultCode = `const cyberind = {
    name: "Cyberind",
    website: "cyberind.my.id",
    since: 2018
};

console.log("Hello, Cyberind!");`;


/*
========================================================
LANGUAGES
========================================================
*/

const languages = [

    ["auto","Auto Detect"],
    ["plaintext","Plain Text"],
    ["javascript","JavaScript"],
    ["typescript","TypeScript"],
    ["xml","HTML / XML"],
    ["css","CSS"],
    ["scss","SCSS"],
    ["less","Less"],
    ["json","JSON"],
    ["python","Python"],
    ["php","PHP"],
    ["bash","Bash"],
    ["shell","Shell"],
    ["sql","SQL"],
    ["java","Java"],
    ["kotlin","Kotlin"],
    ["swift","Swift"],
    ["cpp","C++"],
    ["csharp","C#"],
    ["go","Go"],
    ["rust","Rust"],
    ["ruby","Ruby"],
    ["perl","Perl"],
    ["lua","Lua"],
    ["r","R"],
    ["matlab","MATLAB"],
    ["dart","Dart"],
    ["scala","Scala"],
    ["groovy","Groovy"],
    ["powershell","PowerShell"],
    ["dockerfile","Dockerfile"],
    ["yaml","YAML"],
    ["ini","INI"],
    ["http","HTTP"],
    ["graphql","GraphQL"],
    ["markdown","Markdown"],
    ["diff","Diff"]

];


const $ = id => document.getElementById(id);


/*
========================================================
STATE
========================================================
*/

const state = {

    language:"auto",

    filename:"snippet.js",

    font:"mono",

    fontSize:14,

    theme:"atom-one-dark",

    bg:"purple",

    showWindow:true,

    showTitle:true,

    showLines:true,

    padding:64,

    radius:14

};


/*
========================================================
POPULATE LANGUAGE SELECTS
========================================================
*/

const languageSelects = [

    $("language"),

    $("mobileLanguage"),

    $("drawerLanguage")

];


languageSelects.forEach(select => {

    languages.forEach(([value,label]) => {

        select.add(
            new Option(label,value)
        );

    });

});


/*
========================================================
LANGUAGE HELPERS
========================================================
*/

function detectedLanguage(code){

    if(state.language !== "auto"){
        return state.language;
    }

    if(
        typeof hljs === "undefined" ||
        !code.trim()
    ){
        return "plaintext";
    }

    try{

        const result =
            hljs.highlightAuto(code);

        return result.language || "plaintext";

    }catch(error){

        return "plaintext";

    }

}


function languageLabel(value){

    const found =
        languages.find(
            item => item[0] === value
        );

    return found
        ? found[1]
        : value;

}


/*
========================================================
ESCAPE
========================================================
*/

function escapeHtml(value){

    return value
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


/*
========================================================
HIGHLIGHT
========================================================
*/

function highlightCode(code){

    const lang =
        detectedLanguage(code);

    if(
        lang === "plaintext" ||
        typeof hljs === "undefined"
    ){

        return escapeHtml(code);

    }

    try{

        return hljs.highlight(
            code,
            {
                language:lang,
                ignoreIllegals:true
            }
        ).value;

    }catch(error){

        return escapeHtml(code);

    }

}


/*
========================================================
LINE NUMBERS
========================================================
*/

function lineMarkup(code){

    const count =
        Math.max(
            1,
            code.split("\n").length
        );

    return Array.from(
        {length:count},
        (_,index) => index + 1
    ).join("\n");

}


/*
========================================================
FONT
========================================================
*/

function applyFont(){

    let family;

    if(state.font === "consolas"){

        family =
            "Consolas,monospace";

    }

    else if(state.font === "system"){

        family =
            "ui-monospace,SFMono-Regular,Menlo,monospace";

    }

    else{

        family =
            "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";

    }


    [

        "code",

        "highlight",

        "previewHighlight",

        "editorLines",

        "previewLines"

    ].forEach(id => {

        $(id).style.fontFamily =
            family;

    });


    $("code").style.fontSize =
        state.fontSize + "px";

    $("highlight").style.fontSize =
        state.fontSize + "px";

    $("previewHighlight").style.fontSize =
        state.fontSize + "px";

    $("editorLines").style.fontSize =
        state.fontSize + "px";

    $("previewLines").style.fontSize =
        state.fontSize + "px";

}


/*
========================================================
RENDER
========================================================
*/

function render(){

    const code =
        $("code").value;


    $("highlight")
        .querySelector("code")
        .innerHTML =
            highlightCode(code);


    $("previewHighlight").innerHTML =
        highlightCode(code);


    $("editorLines").textContent =
        lineMarkup(code);


    $("previewLines").textContent =
        lineMarkup(code);


    $("toolbarFilename").textContent =
        state.filename || "snippet";


    $("previewTitle").textContent =
        state.filename || "snippet";


    $("langBadge").textContent =
        state.language === "auto"

            ? "Auto → " +
              languageLabel(
                  detectedLanguage(code)
              )

            : languageLabel(
                  state.language
              );


    $("windowBar")
        .classList
        .toggle(
            "hidden",
            !state.showWindow
        );


    $("previewTitle")
        .classList
        .toggle(
            "hidden",
            !state.showTitle
        );


    $("editorLines")
        .classList
        .toggle(
            "hidden",
            !state.showLines
        );


    $("previewLines")
        .classList
        .toggle(
            "hidden",
            !state.showLines
        );


    $("exportFrame").className =
        "export-frame bg-" +
        state.bg;


    $("exportFrame").style.padding =
        state.padding + "px";


    $("codeCard").style.borderRadius =
        state.radius + "px";


    applyFont();

}


/*
========================================================
SYNC CONTROLS
========================================================
*/

function syncControls(){

    $("language").value =
        state.language;

    $("mobileLanguage").value =
        state.language;

    $("drawerLanguage").value =
        state.language;


    $("filename").value =
        state.filename;

    $("drawerFilename").value =
        state.filename;


    $("font").value =
        state.font;

    $("drawerFont").value =
        state.font;


    $("fontSize").value =
        state.fontSize;

    $("drawerFontSize").value =
        state.fontSize;


    $("theme").value =
        state.theme;

    $("drawerTheme").value =
        state.theme;


    $("showWindow").checked =
        state.showWindow;

    $("drawerShowWindow").checked =
        state.showWindow;


    $("showTitle").checked =
        state.showTitle;

    $("drawerShowTitle").checked =
        state.showTitle;


    $("showLines").checked =
        state.showLines;

    $("drawerShowLines").checked =
        state.showLines;


    $("padding").value =
        state.padding;

    $("drawerPadding").value =
        state.padding;


    $("radius").value =
        state.radius;

    $("drawerRadius").value =
        state.radius;


    $("paddingVal").textContent =
        state.padding + "px";

    $("drawerPaddingVal").textContent =
        state.padding + "px";


    $("radiusVal").textContent =
        state.radius + "px";

    $("drawerRadiusVal").textContent =
        state.radius + "px";


    document
        .querySelectorAll(".swatch")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.bg === state.bg
            );

        });

}


/*
========================================================
THEME
========================================================
*/

function setTheme(theme){

    state.theme = theme;

    const link =
        document.querySelector(
            'link[rel="stylesheet"]'
        );

    link.href =
        "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/" +
        theme +
        ".min.css";

}


/*
========================================================
FIELD
========================================================
*/

function setField(field,value){

    state[field] = value;

    if(field === "theme"){

        setTheme(value);

    }

    syncControls();

    render();

}


/*
========================================================
TOAST
========================================================
*/

function toast(message){

    const element =
        $("toast");

    element.textContent =
        message;

    element.classList.add("show");

    clearTimeout(
        window.__toastTimer
    );

    window.__toastTimer =
        setTimeout(
            () => {
                element.classList.remove(
                    "show"
                );
            },
            1800
        );

}


/*
========================================================
INITIAL CODE
========================================================
*/

$("code").value =
    defaultCode;


/*
========================================================
CODE INPUT
========================================================
*/

$("code").addEventListener(
    "input",
    render
);


/*
========================================================
SCROLL SYNC
========================================================
*/

$("code").addEventListener(
    "scroll",
    () => {

        $("highlight").scrollTop =
            $("code").scrollTop;

        $("highlight").scrollLeft =
            $("code").scrollLeft;

    }
);


/*
========================================================
TAB SUPPORT
========================================================
*/

$("code").addEventListener(
    "keydown",
    event => {

        if(event.key === "Tab"){

            event.preventDefault();

            const start =
                event.target.selectionStart;

            const end =
                event.target.selectionEnd;


            event.target.setRangeText(
                "    ",
                start,
                end,
                "end"
            );


            render();

        }

    }
);


/*
========================================================
TEXT CONTROLS
========================================================
*/

$("filename").addEventListener(
    "input",
    event =>
        setField(
            "filename",
            event.target.value
        )
);


$("drawerFilename").addEventListener(
    "input",
    event =>
        setField(
            "filename",
            event.target.value
        )
);


/*
========================================================
LANGUAGE
========================================================
*/

$("language").addEventListener(
    "change",
    event =>
        setField(
            "language",
            event.target.value
        )
);


$("mobileLanguage").addEventListener(
    "change",
    event =>
        setField(
            "language",
            event.target.value
        )
);


$("drawerLanguage").addEventListener(
    "change",
    event =>
        setField(
            "language",
            event.target.value
        )
);


/*
========================================================
FONT
========================================================
*/

$("font").addEventListener(
    "change",
    event =>
        setField(
            "font",
            event.target.value
        )
);


$("drawerFont").addEventListener(
    "change",
    event =>
        setField(
            "font",
            event.target.value
        )
);


/*
========================================================
FONT SIZE
========================================================
*/

$("fontSize").addEventListener(
    "input",
    event => {

        const value =
            Math.max(
                10,
                Math.min(
                    28,
                    Number(event.target.value) || 14
                )
            );

        setField(
            "fontSize",
            value
        );

    }
);


$("drawerFontSize").addEventListener(
    "input",
    event => {

        const value =
            Math.max(
                10,
                Math.min(
                    28,
                    Number(event.target.value) || 14
                )
            );

        setField(
            "fontSize",
            value
        );

    }
);


/*
========================================================
THEME CONTROLS
========================================================
*/

$("theme").addEventListener(
    "change",
    event =>
        setField(
            "theme",
            event.target.value
        )
);


$("drawerTheme").addEventListener(
    "change",
    event =>
        setField(
            "theme",
            event.target.value
        )
);


/*
========================================================
TOGGLES
========================================================
*/

["showWindow","showTitle","showLines"]
.forEach(key => {

    $(key).addEventListener(
        "change",
        event =>
            setField(
                key,
                event.target.checked
            )
    );


    const drawerId =
        "drawer" +
        key.charAt(0).toUpperCase() +
        key.slice(1);


    $(drawerId).addEventListener(
        "change",
        event =>
            setField(
                key,
                event.target.checked
            )
    );

});


/*
========================================================
SPACING
========================================================
*/

$("padding").addEventListener(
    "input",
    event =>
        setField(
            "padding",
            Number(event.target.value)
        )
);


$("drawerPadding").addEventListener(
    "input",
    event =>
        setField(
            "padding",
            Number(event.target.value)
        )
);


$("radius").addEventListener(
    "input",
    event =>
        setField(
            "radius",
            Number(event.target.value)
        )
);


$("drawerRadius").addEventListener(
    "input",
    event =>
        setField(
            "radius",
            Number(event.target.value)
        )
);


/*
========================================================
BACKGROUND
========================================================
*/

document
    .querySelectorAll(".swatch")
    .forEach(button => {

        button.addEventListener(
            "click",
            () =>
                setField(
                    "bg",
                    button.dataset.bg
                )
        );

    });


/*
========================================================
COPY
========================================================
*/

$("copyBtn").addEventListener(
    "click",
    async () => {

        const text =
            $("code").value;


        try{

            await navigator.clipboard.writeText(
                text
            );

            toast(
                "Kode berhasil disalin"
            );

        }catch(error){

            $("code").select();

            document.execCommand(
                "copy"
            );

            toast(
                "Kode berhasil disalin"
            );

        }

    }
);


/*
========================================================
RESET
========================================================
*/

$("resetBtn").addEventListener(
    "click",
    () => {

        Object.assign(
            state,
            {

                language:"auto",

                filename:"snippet.js",

                font:"mono",

                fontSize:14,

                theme:"atom-one-dark",

                bg:"purple",

                showWindow:true,

                showTitle:true,

                showLines:true,

                padding:64,

                radius:14

            }
        );


        $("code").value =
            defaultCode;


        setTheme(
            state.theme
        );


        syncControls();

        render();

        toast(
            "Berhasil direset"
        );

    }
);


/*
========================================================
FORMAT JSON
========================================================
*/

$("formatBtn").addEventListener(
    "click",
    () => {

        if(
            state.language === "json"
        ){

            try{

                const formatted =
                    JSON.stringify(
                        JSON.parse(
                            $("code").value
                        ),
                        null,
                        2
                    );


                $("code").value =
                    formatted;


                render();

                toast(
                    "JSON berhasil diformat"
                );

            }catch(error){

                toast(
                    "JSON tidak valid"
                );

            }

        }else{

            toast(
                "Format otomatis tersedia untuk JSON"
            );

        }

    }
);


/*
========================================================
EXPORT PNG
========================================================
*/

async function exportPNG(){

    if(
        typeof html2canvas === "undefined"
    ){

        toast(
            "Library export belum termuat"
        );

        return;

    }


    const frame =
        $("exportFrame");


    try{

        /*
        Penting:
        Yang dicapture adalah EXPORT FRAME,
        bukan code-card.

        Jadi background + padding
        ikut masuk ke PNG.
        */

        const canvas =
            await html2canvas(
                frame,
                {

                    backgroundColor:
                        null,

                    scale:
                        Math.min(
                            window.devicePixelRatio || 1,
                            2
                        ),

                    useCORS:
                        true,

                    allowTaint:
                        false,

                    logging:
                        false

                }
            );


        const link =
            document.createElement("a");


        const filename =
            (
                state.filename ||
                "snippet"
            )
            .replace(
                /\.[^/.]+$/,
                ""
            )
            .replace(
                /[^\w.-]+/g,
                "-"
            ) || "snippet";


        link.download =
            filename + ".png";


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        document.body.appendChild(
            link
        );

        link.click();

        link.remove();


        toast(
            "PNG berhasil dibuat"
        );

    }catch(error){

        console.error(
            "PNG export error:",
            error
        );

        toast(
            "Gagal membuat PNG"
        );

    }

}


/*
========================================================
PNG BUTTONS
========================================================
*/

$("pngBtn").addEventListener(
    "click",
    exportPNG
);


$("mobilePng").addEventListener(
    "click",
    exportPNG
);


/*
========================================================
MOBILE DRAWER
========================================================
*/

$("settingsBtn").addEventListener(
    "click",
    () => {

        $("drawer")
            .classList
            .add("open");

    }
);


$("closeDrawer").addEventListener(
    "click",
    () => {

        $("drawer")
            .classList
            .remove("open");

    }
);


$("drawer").addEventListener(
    "click",
    event => {

        if(
            event.target === $("drawer")
        ){

            $("drawer")
                .classList
                .remove("open");

        }

    }
);


/*
========================================================
DRAWER BACKGROUND BUTTONS
========================================================
*/

const drawerSwatches =
    $("drawerSwatches");


[
    ["purple","bg-purple"],
    ["sunset","bg-sunset"],
    ["ocean","bg-ocean"],
    ["aurora","bg-aurora"],
    ["pink","bg-pink"],
    ["dark","bg-dark"],
    ["light","bg-light"],
    ["transparent","bg-transparent"]
]
.forEach(
    ([value,className]) => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "swatch " +
            className;


        button.dataset.bg =
            value;


        button.title =
            value;


        button.addEventListener(
            "click",
            () =>
                setField(
                    "bg",
                    value
                )
        );


        drawerSwatches.appendChild(
            button
        );

    }
);


/*
========================================================
INITIALIZE
========================================================
*/

syncControls();

setTheme(
    state.theme
);

render();

</script>
