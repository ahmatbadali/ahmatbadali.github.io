<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Formatter Gacor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            color: #38bdf8;
        }
        .editor-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        select {
            background-color: #334155;
            color: #fff;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #status {
            font-size: 14px;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Code Formatter Pro (Anti-Ngelag)</h2>
    <div class="editor-group">
        <div>
            <label for="inputCode">Masukkan Kode Berantakan / Rumit:</label>
            <textarea id="inputCode" placeholder="Tempel kode masif kamu di sini..."></textarea>
        </div>
        
        <div class="controls">
            <select id="parserType">
                <option value="babel">JavaScript</option>
                <option value="html">HTML</option>
                <option value="postcss">CSS</option>
                <option value="json">JSON</option>
            </select>
            <button id="formatBtn" onclick="runFormatter()">Format Kode</button>
            <span id="status">Status: Siap</span>
        </div>

        <div>
            <label for="outputCode">Hasil Rapi:</label>
            <textarea id="outputCode" readonly placeholder="Hasil format akan muncul di sini..."></textarea>
        </div>
    </div>
</div>

<script>
    // 1. Membuat Web Worker secara inline menggunakan Blob (tanpa perlu file worker terpisah)
    const workerCode = `
        importScripts('https://unpkg.com/prettier@2.8.8/standalone.js');
        importScripts('https://unpkg.com/prettier@2.8.8/parser-babel.js');
        importScripts('https://unpkg.com/prettier@2.8.8/parser-html.js');
        importScripts('https://unpkg.com/prettier@2.8.8/parser-postcss.js');
        importScripts('https://unpkg.com/prettier@2.8.8/parser-graphql.js');

        self.onmessage = function(e) {
            const { code, parser } = e.data;
            try {
                let pluginList = [prettierPlugins.babel];
                let parserName = 'babel';

                if (parser === 'html') {
                    pluginList = [prettierPlugins.html];
                    parserName = 'html';
                } else if (parser === 'postcss') {
                    pluginList = [prettierPlugins.postcss];
                    parserName = 'css';
                } else if (parser === 'json') {
                    pluginList = [prettierPlugins.babel];
                    parserName = 'json';
                }

                const formatted = prettier.format(code, {
                    parser: parserName,
                    plugins: pluginList,
                    semi: true,
                    singleQuote: true,
                });

                self.postMessage({ success: true, result: formatted });
            } catch (error) {
                self.postMessage({ success: false, error: error.message });
            }
        };
    `;

    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));

    // 2. Menghubungkan tombol dan worker ke antarmuka utama
    function runFormatter() {
        const input = document.getElementById('inputCode').value;
        const parser = document.getElementById('parserType').value;
        const btn = document.getElementById('formatBtn');
        const status = document.getElementById('status');

        if (!input.trim()) {
            alert('Masukkan kode terlebih dahulu!');
            return;
        }

        // Ubah UI jadi mode loading (web tidak nge-freeze sama sekali)
        btn.disabled = true;
        status.textContent = 'Status: Sedang memproses kode masif di latar belakang...';
        document.getElementById('outputCode').value = '';

        // Kirim data ke Web Worker
        worker.postMessage({ code: input, parser: parser });
    }

    // Menerima hasil dari background worker
    worker.onmessage = function(e) {
        const btn = document.getElementById('formatBtn');
        const status = document.getElementById('status');
        
        btn.disabled = false;

        if (e.data.success) {
            document.getElementById('outputCode').value = e.data.result;
            status.textContent = 'Status: Berhasil! Kode sukses dirapikan.';
        } else {
            document.getElementById('outputCode').value = 'Error saat memformat:\n' + e.data.error;
            status.textContent = 'Status: Gagal memproses kode.';
        }
    };
</script>

</body>
</html>
